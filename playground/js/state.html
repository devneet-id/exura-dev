<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>js · state & effect</title>
  <link rel="stylesheet" href="/pkg/exuracss/exura.css">
  <link rel="stylesheet" href="/assets/dev.css">
</head>
<body>
  <div container size="py:3">

    <section dev-specimen>
      <h2 text="h4 bold">module + state + effect(deps)</h2>
      <exura-counter>
        <div card="primary:1" size="p:2" flex="j:between a:middle">
          <span text="h3" data-count>{{count}}</span>
          <div flex style="gap:.5rem">
            <button button="default" onclick="counter.state.set('count', counter.state.get('count') - 1)">−</button>
            <button button="primary" onclick="counter.state.set('count', counter.state.get('count') + 1)">+</button>
          </div>
        </div>
      </exura-counter>
      <p dev-code>effect(() => render(), ['count'])</p>
    </section>

    <section dev-specimen>
      <h2 text="h4 bold">effects with and without deps</h2>
      <exura-pair>
        <div card="default:1" size="p:2">a = <b data-a>{{a}}</b> · b = <b data-b>{{b}}</b></div>
      </exura-pair>
      <div flex size="mt:1" style="gap:.5rem">
        <button button="primary" onclick="pair.state.set('a', pair.state.get('a') + 1)">a + 1</button>
        <button button="secondary" onclick="pair.state.set('b', pair.state.get('b') + 1)">b + 1</button>
        <button button="default" onclick="pair.state.set('a', pair.state.get('a'))">set a to the same value</button>
      </div>
      <div dev-log id="pair-log" card="default:1" size="p:1 mt:1"></div>
    </section>

  </div>

  <script src="/pkg/exurajs/exura.js"></script>
  <script>
    Exura.module(function counter() {
      const { state, effect, render } = counter;
      state.set('count', 0);
      effect(() => render(), ['count']);
    });
    counter();

    const log = (line) => {
      const el = document.getElementById('pair-log');
      el.textContent = (line + '\n' + el.textContent).split('\n').slice(0, 8).join('\n');
    };

    Exura.module(function pair() {
      const { state, effect, render } = pair;
      state.set('a', 0);
      state.set('b', 0);
      effect(() => render());                                        // every change
      effect(() => log(`effect[a] ran · a=${state.get('a')}`), ['a']); // only when a changes
      effect(() => log(`effect[b] ran · b=${state.get('b')}`), ['b']); // only when b changes
    });
    pair();
  </script>
  <script src="/assets/dev.js"></script>
</body>
</html>
