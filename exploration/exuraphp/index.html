<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>php · request console</title>
  <link rel="stylesheet" href="/core/exura.css">
  <link rel="stylesheet" href="/assets/dev.css">
</head>
<body>
  <main dev-page>
    <header dev-head>
      <div dev-kicker>exuraphp</div>
      <h1>Request console</h1>
      <p>Send any method and body to <code dev-inline>exuraphp/api/index.php</code>. Every answer is JSON with an <code dev-inline>E X U R A</code> trace block.</p>
    </header>

    <section dev-specimen>
      <h2>Send a request</h2>
      <p>Try <code dev-inline>POST /exuraphp/api/echo</code>, <code dev-inline>/exuraphp/api/user/42</code>, <code dev-inline>/exuraphp/api/fail</code>, <code dev-inline>/exuraphp/api/warn</code>. The CRUD API lives in <a href="/app/">app</a>.</p>
      <exura-request>
        <div dev-demo>
          <form flex="wrap a:end" style="gap:.75rem" onsubmit="event.preventDefault(); request.send()">
            <div style="width:8rem">
              <label dev-label>method</label>
              <select name="verb">
                <option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option>
              </select>
            </div>
            <div flex="1" style="min-width:14rem">
              <label dev-label>route</label>
              <input name="route" type="text" value="/exuraphp/api/echo?name=exura">
            </div>
            <button button="primary" style="margin-bottom:.3rem">Send</button>
            <div size="w:full">
              <label dev-label>json body (not sent with GET)</label>
              <textarea name="body" rows="2">{"title": "from the console"}</textarea>
            </div>
          </form>
          <div text="bold" data-status>{{status}}</div>
        </div>
        <pre dev-log data-output>{{output}}</pre>
      </exura-request>
    </section>
  </main>

  <script src="/core/exura.js"></script>
  <script>
    // the module name is the tag: request() renders <exura-request>
    Exura.module(function request() {
      const { state, effect, render } = request;
      state.set('status', 'ready');
      state.set('output', '');

      request.send = async () => {
        const form = document.querySelector('exura-request form');
        const method = form.verb.value;
        const route = form.route.value;
        const options = { method, headers: {} };
        if (method !== 'GET' && form.body.value.trim()) {
          options.body = form.body.value;
          options.headers['Content-Type'] = 'application/json';
        }
        const values = [form.verb.value, form.route.value, form.body.value];
        const started = performance.now();
        const response = await fetch(route, options);
        const text = await response.text();
        state.set('output', text);
        state.set('status', `${method} ${route} → ${response.status} · ${Math.round(performance.now() - started)}ms`);
        // render() rebuilds the form, so put the user's values back
        const again = document.querySelector('exura-request form');
        [again.verb.value, again.route.value, again.body.value] = values;
      };

      effect(() => render(), ['status', 'output']);
    });
    request();
  </script>
  <script src="/assets/dev.js"></script>
</body>
</html>
