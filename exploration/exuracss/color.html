<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>css · color</title>
  <link rel="stylesheet" href="/core/exura.css">
  <link rel="stylesheet" href="/assets/dev.css">
</head>
<body>
  <main dev-page>
    <header dev-head>
      <div dev-kicker>exuracss</div>
      <h1>Color balancing</h1>
      <p>Every color of <code dev-inline>exura.json</code> with its ten transparent shades, as <code dev-inline>card="NAME:N"</code>. Switch light / dark: every number must stay readable on both. Unreadable numbers here are a bug in the fetched exuracss.</p>
    </header>
    <div id="palette"></div>
  </main>

  <script>
    // read the palette from the built stylesheet, so new colors show up without touching this page
    const names = new Set();
    for (const sheet of document.styleSheets) {
      let rules;
      try { rules = sheet.cssRules; } catch (e) { continue; }
      for (const rule of rules) {
        if (rule.selectorText !== ':root') continue;
        for (const prop of rule.style) {
          const m = prop.match(/^--color-([a-z]+)$/);
          if (m) names.add(m[1]);
        }
      }
    }

    const palette = document.getElementById('palette');
    for (const name of names) {
      const shades = Array.from({ length: 10 }, (_, i) => i + 1).map(i => `
        <div size="p:1" style="width:10%">
          <div card="${name}:${i}" size="p:1" text="center" title="card=&quot;${name}:${i}&quot;">${i}</div>
        </div>`).join('');
      palette.insertAdjacentHTML('beforeend', `
        <section dev-specimen>
          <h2><span card="${name}" size="px:1">${name}</span></h2>
          <div dev-demo><div flex="nowrap">${shades}</div></div>
        </section>`);
    }
  </script>
  <script src="/assets/dev.js"></script>
</body>
</html>
