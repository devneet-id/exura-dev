<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>js · watch</title>
  <link rel="stylesheet" href="/core/exura.css">
  <link rel="stylesheet" href="/assets/dev.css">
</head>
<body>
  <main dev-page>
    <header dev-head>
      <div dev-kicker>exurajs</div>
      <h1>Watch</h1>
      <p><code dev-inline>watch(selector, fn)</code> runs <code dev-inline>fn</code> once, the first time the element enters the viewport — for lazy content.</p>
    </header>

    <section dev-specimen>
      <h2>Two boxes below the fold</h2>
      <p>Scroll down. Each box changes when it is first seen.</p>
      <pre dev-code>lazy.watch('#box-1', () => { /* runs once, when seen */ });</pre>
    </section>

    <exura-lazy>
      <div style="height:100vh" flex="j:center a:middle" dev-label>scroll ↓</div>
      <div dev-demo id="box-1" text="center">waiting…</div>
      <div style="height:60vh"></div>
      <div dev-demo id="box-2" text="center">waiting…</div>
    </exura-lazy>
  </main>

  <script src="/core/exura.js"></script>
  <script>
    Exura.module(function lazy() {
      const seen = (id) => () => {
        const el = document.getElementById(id);
        el.innerHTML = `<span dev-value>✓</span><br>seen at ${new Date().toLocaleTimeString()}`;
        el.dataset.seen = 'true';
      };
      lazy.watch('#box-1', seen('box-1'));
      lazy.watch('#box-2', seen('box-2'));
    });
    lazy();
  </script>
  <script src="/assets/dev.js"></script>
</body>
</html>
