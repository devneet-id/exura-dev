<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>exurajs-modules</title>
  <link rel="stylesheet" href="/core/exura.css">
  <link rel="stylesheet" href="/index.css">
</head>
<body>
  <header scenario>
    <small>scenario · exurajs-modules</small>
    <h1>Many modules on one page</h1>
    <p>Two modules with their own state; one module calls the other. A module without its element only warns.</p>
    <ul expect></ul>
  </header>

  <main>
    <div flex="wrap" style="gap:1rem">
      <exura-cart><div ring="b:full b:default-3" size="p:2">cart: <strong items>{{count}}</strong> item(s)</div></exura-cart>
      <exura-shop><div ring="b:full b:default-3" size="p:2">shop: <button button="primary sm" onclick="shop.buy()">buy</button> sold <strong sold>{{sold}}</strong></div></exura-shop>
    </div>
  </main>
  <script src="/core/exura.js"></script>
  <script src="/index.js"></script>
</body>
</html>
